[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timelapse-rapidraw"
version = "0.1.0"
description = "Deflicker RapidRAW timelapse sequences using timelapse-core, through RapidRAW's own sidecar files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["timelapse-core[raw]"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
timelapse-rapidraw = "timelapse_rapidraw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/timelapse_rapidraw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
