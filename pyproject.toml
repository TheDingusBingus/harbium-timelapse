[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbium-timelapse"
version = "0.2.0"
description = "A free, open-source timelapse tool: deflicker and smooth white balance, made to work alongside your photo editor."
readme = "README.md"
license = "MIT"
authors = [{ name = "James Harbour" }]
requires-python = ">=3.10"
keywords = ["timelapse", "deflicker", "photography", "raw", "white balance", "rapidraw", "lightroom"]
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "exifread>=3",
]

[project.optional-dependencies]
raw = ["rawpy>=0.21"]
tiff = ["tifffile>=2023.1"]
dev = ["pytest>=8", "rawpy>=0.21"]

[project.scripts]
timelapse = "harbium_timelapse.cli:main"
timelapse-rapidraw = "harbium_timelapse.editors.rapidraw.cli:main"

# Editors are plug-ins. Another package can add one by declaring an entry point
# in this group; `timelapse prepare` then finds it automatically.
[project.entry-points."harbium_timelapse.editors"]
rapidraw = "harbium_timelapse.editors.rapidraw.adapter:RapidRAW"
lightroom = "harbium_timelapse.editors.lightroom.adapter:Lightroom"

[tool.hatch.build.targets.wheel]
packages = ["src/harbium_timelapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
