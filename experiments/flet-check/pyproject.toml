[project]
name = "harbium-flet-check"
version = "0.1.0"
description = "Phase 1 experiments: does Flet do what the harbium-timelapse app needs?"
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.5",
    "flet-charts==1.0.5",
    "numpy",
    "pillow",
    "rawpy",
    "harbium-timelapse[raw] @ git+https://github.com/TheDingusBingus/harbium-timelapse",
]

[tool.flet]
product = "Harbium Flet check"
company = "Harbium"
org = "studio.harbium"
copyright = "MIT licence"

[tool.flet.app]
path = "src"
